name: Wire Next-Gen Studio PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply wiring migration
        run: python3 scripts/wire-nextgen-studio.py

      - name: Validate Python worker sources
        run: python3 -m py_compile infrastructure/aws/url-worker/orchestrator.py infrastructure/aws/url-worker/worker.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run focused server tests
        run: npm test -- --run server/__tests__/root-admin-access.test.ts

      - name: Commit wired source to PR branch
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx server/app.js services/cloudStreamingService.ts components/CloudBroadcastPanel.tsx services/oauthService.ts services/stripe.ts infrastructure/aws/url-worker/worker.py
          git commit -m "Wire next-gen studio features"
          git push origin HEAD:${{ github.head_ref }}
