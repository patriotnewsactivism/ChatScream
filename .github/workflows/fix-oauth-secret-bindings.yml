name: Fix OAuth secret bindings

on:
  push:
    paths:
      - '.github/workflows/fix-oauth-secret-bindings.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/584450564662/locations/global/workloadIdentityPools/chatscream-github/providers/chatscream-main
          service_account: chatscream-cloud-ops@chat-scream.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: chatscream

      - name: Convert legacy plaintext OAuth secrets to Secret Manager refs
        run: |
          set -euo pipefail
          gcloud run services update chatscream-backend \
            --project chatscream \
            --region us-central1 \
            --remove-env-vars=GOOGLE_CLIENT_SECRET,YOUTUBE_CLIENT_SECRET \
            --update-env-vars=GOOGLE_CLIENT_ID=584450564662-vvlnooo2oe25ltstet0mkqajm4ta80d8.apps.googleusercontent.com,YOUTUBE_CLIENT_ID=584450564662-ek0a4ibt01t9ho6guc7sfqp59dq0vrs5.apps.googleusercontent.com \
            --update-secrets=GOOGLE_CLIENT_SECRET=chatscream-google-client-secret:latest,YOUTUBE_CLIENT_SECRET=chatscream-youtube-client-secret:latest \
            --quiet

      - name: Verify secret binding types
        run: |
          set -euo pipefail
          gcloud run services describe chatscream-backend \
            --project chatscream \
            --region us-central1 \
            --format=json > /tmp/service.json

          echo 'OAuth variable binding types:'
          jq -r '
            .spec.template.spec.containers[0].env[]?
            | select(.name == "GOOGLE_CLIENT_ID" or .name == "GOOGLE_CLIENT_SECRET" or .name == "YOUTUBE_CLIENT_ID" or .name == "YOUTUBE_CLIENT_SECRET")
            | [.name, (if .valueFrom then "secretRef" else "literal" end)]
            | @tsv
          ' /tmp/service.json

          jq -e '
            any(.spec.template.spec.containers[0].env[]?;
              .name == "GOOGLE_CLIENT_SECRET" and .valueFrom.secretKeyRef.name == "chatscream-google-client-secret")
            and
            any(.spec.template.spec.containers[0].env[]?;
              .name == "YOUTUBE_CLIENT_SECRET" and .valueFrom.secretKeyRef.name == "chatscream-youtube-client-secret")
          ' /tmp/service.json >/dev/null

      - name: Verify production API
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://api.chatscream.live/api/health
          echo
