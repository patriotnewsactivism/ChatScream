name: Patch OAuth Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-oauth-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch OAuth runtime
        shell: python
        run: |
          from pathlib import Path

          oauth = Path('services/oauthService.ts')
          text = oauth.read_text()

          text = text.replace(
              "const YOUTUBE_PRODUCTION_REDIRECT_URI =\n  'https://api.chatscream.live/api/auth/oauth/google/callback';",
              "const YOUTUBE_PRODUCTION_REDIRECT_URI =\n  'https://api.chatscream.live/api/auth/oauth/google/callback';\nconst CANONICAL_FRONTEND_CALLBACK = 'https://www.chatscream.live/oauth/callback';"
          )

          old_browser = """const getBrowserCallbackUri = (): string => {\n  if (typeof window !== 'undefined' && window.location?.origin) {\n    return `${window.location.origin}/oauth/callback`;\n  }\n  return 'https://www.chatscream.live/oauth/callback';\n};"""
          new_browser = """const getBrowserCallbackUri = (): string => {\n  if (typeof window !== 'undefined') {\n    const host = window.location?.hostname || '';\n    if (host === 'localhost' || host === '127.0.0.1') {\n      return `${window.location.origin}/oauth/callback`;\n    }\n  }\n  return CANONICAL_FRONTEND_CALLBACK;\n};"""
          if old_browser not in text:
              raise SystemExit('getBrowserCallbackUri pattern not found')
          text = text.replace(old_browser, new_browser)

          text = text.replace(
              "clientId: publicConfig.youtubeClientId || import.meta.env.VITE_YOUTUBE_CLIENT_ID || '',",
              "clientId: publicConfig.youtubeClientId || (typeof window !== 'undefined' && ['localhost', '127.0.0.1'].includes(window.location.hostname) ? import.meta.env.VITE_YOUTUBE_CLIENT_ID || '' : ''),"
          )
          text = text.replace(
              "clientId: publicConfig.facebookAppId || import.meta.env.VITE_FACEBOOK_APP_ID || '',",
              "clientId: publicConfig.facebookAppId || (typeof window !== 'undefined' && ['localhost', '127.0.0.1'].includes(window.location.hostname) ? import.meta.env.VITE_FACEBOOK_APP_ID || '' : ''),"
          )
          text = text.replace(
              "authorizationEndpoint: 'https://www.facebook.com/v18.0/dialog/oauth',",
              "authorizationEndpoint: 'https://www.facebook.com/v26.0/dialog/oauth',"
          )
          text = text.replace(
              "tokenEndpoint: 'https://graph.facebook.com/v18.0/oauth/access_token',",
              "tokenEndpoint: 'https://graph.facebook.com/v26.0/oauth/access_token',"
          )
          text = text.replace(
              "redirectUri: publicConfig.redirectUriBase || browserRedirectUri,",
              "redirectUri: CANONICAL_FRONTEND_CALLBACK,",
              1
          )
          oauth.write_text(text)

          callback = Path('pages/OAuthCallback.tsx')
          cb = callback.read_text()
          marker = "  const attemptedSessionRestore = useRef(false);\n  const exitScheduled = useRef(false);"
          replacement = "  const attemptedSessionRestore = useRef(false);\n  const attemptedDestinationCallback = useRef(false);\n  const exitScheduled = useRef(false);"
          if marker not in cb:
              raise SystemExit('callback ref marker not found')
          cb = cb.replace(marker, replacement)

          old_block = """      if (isDestinationOAuthCallback) {\n        if (!user) {\n          setStatus('error');"""
          new_block = """      if (isDestinationOAuthCallback) {\n        if (!user) {\n          setStatus('error');"""
          if old_block not in cb:
              raise SystemExit('destination callback block not found')

          guard_anchor = """          return;\n        }\n\n        setStatus('loading');\n        setMessage(`Connecting ${platformLabel}...`);\n\n        const result = await handleOAuthCallback(searchParams);"""
          guard_replacement = """          return;\n        }\n\n        // OAuth state is single-use. refreshProfile() can re-render this component,\n        // so never consume the same provider callback twice.\n        if (attemptedDestinationCallback.current) return;\n        attemptedDestinationCallback.current = true;\n\n        setStatus('loading');\n        setMessage(`Connecting ${platformLabel}...`);\n\n        const result = await handleOAuthCallback(searchParams);"""
          if guard_anchor not in cb:
              raise SystemExit('destination guard anchor not found')
          cb = cb.replace(guard_anchor, guard_replacement, 1)
          callback.write_text(cb)

      - name: Verify patch compiles
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Commit patched runtime
        run: |
          git config user.name 'ChatScream Cloud Ops'
          git config user.email 'actions@users.noreply.github.com'
          git add services/oauthService.ts pages/OAuthCallback.tsx
          git commit -m 'Fix production OAuth callback state and Facebook runtime'
          git push
