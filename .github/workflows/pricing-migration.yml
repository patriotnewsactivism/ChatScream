name: Profit-safe pricing migration

on:
  push:
    branches:
      - pricing/profit-safe-cloud-tiers
    paths:
      - .github/workflows/pricing-migration.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pricing/profit-safe-cloud-tiers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply pricing catalog migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected text for {label}")
              return text.replace(old, new)

          # services/stripe.ts — authoritative client plan catalog
          path = 'services/stripe.ts'
          text = read(path)
          text = replace_required(
              text,
              "export type PlanTier = 'free' | 'pro' | 'expert' | 'enterprise';",
              "export type PlanTier = 'free' | 'pro' | 'expert' | 'enterprise' | 'business';",
              'stripe PlanTier',
          )
          start = text.index('export const PRICING_PLANS: PricingPlan[] = [')
          end = text.index('\n];', start) + 3
          catalog = '''export const PRICING_PLANS: PricingPlan[] = [
  {
    id: 'free',
    name: 'Free',
    description: 'Try ChatScream with essential live streaming',
    price: 0,
    interval: 'month',
    features: [
      '2 streaming destinations',
      'Unlimited local device streaming',
      '0 cloud broadcast hours',
      '720p streaming quality',
      'Basic overlays',
      'ChatScream watermark on stream',
      '1 GB DVR storage',
    ],
    limits: {
      destinations: 2,
      localStreamHours: -1,
      cloudStreamHours: 0,
      chatScreams: 0,
      storage: 1,
    },
    stripePriceId: 'price_free',
    hasWatermark: true,
  },
  {
    id: 'pro',
    name: 'Starter',
    description: 'Affordable multi-streaming with cloud broadcast access',
    price: 19,
    interval: 'month',
    features: [
      '3 simultaneous destinations',
      'Unlimited local device streaming',
      '2 cloud broadcast hours',
      '1080p streaming quality',
      'No watermark',
      'Basic Chat Screamer alerts',
      '25 GB DVR storage',
      'Email support',
    ],
    limits: {
      destinations: 3,
      localStreamHours: -1,
      cloudStreamHours: 2,
      chatScreams: 50,
      storage: 25,
    },
    stripePriceId:
      import.meta.env.VITE_STRIPE_STARTER_PRICE_ID ||
      import.meta.env.VITE_STRIPE_PRO_PRICE_ID ||
      'price_1U4uH8Q38lVRBBaogRLIp28w',
    hasWatermark: false,
  },
  {
    id: 'expert',
    name: 'Creator',
    description: 'Serious creator capacity with more cloud hours and storage',
    price: 39,
    interval: 'month',
    features: [
      '5 simultaneous destinations',
      'Unlimited local device streaming',
      '8 cloud broadcast hours',
      '1080p/60fps streaming',
      'No watermark',
      'Full Chat Screamer tiers',
      'Custom Scream sounds/visuals',
      '100 GB DVR storage',
      'Priority support',
    ],
    limits: {
      destinations: 5,
      localStreamHours: -1,
      cloudStreamHours: 8,
      chatScreams: 200,
      storage: 100,
    },
    stripePriceId:
      import.meta.env.VITE_STRIPE_CREATOR_PRICE_ID ||
      import.meta.env.VITE_STRIPE_EXPERT_PRICE_ID ||
      'price_1U7PZkQ38lVRBBao8s6AHo1O',
    hasWatermark: false,
  },
  {
    id: 'enterprise',
    name: 'Pro',
    description: 'High-capacity professional streaming with API access',
    price: 79,
    interval: 'month',
    features: [
      '8 simultaneous destinations',
      'Unlimited local device streaming',
      '20 cloud broadcast hours',
      '1080p/60fps streaming',
      'No watermark',
      'Maximum Scream customization',
      'Custom TTS voices',
      '250 GB DVR storage',
      'API access',
      'Priority support',
    ],
    limits: {
      destinations: 8,
      localStreamHours: -1,
      cloudStreamHours: 20,
      chatScreams: 999,
      storage: 250,
    },
    stripePriceId:
      import.meta.env.VITE_STRIPE_PRO_PRICE_ID ||
      import.meta.env.VITE_STRIPE_ENTERPRISE_PRICE_ID ||
      'price_1U7PZpQ38lVRBBao4VjArshi',
    popular: true,
    hasWatermark: false,
  },
  {
    id: 'business',
    name: 'Business',
    description: 'Cloud-first capacity for teams, agencies, and scheduled channels',
    price: 149,
    interval: 'month',
    features: [
      '10 simultaneous destinations',
      'Unlimited local device streaming',
      '40 cloud broadcast hours',
      'Browser-independent cloud playback',
      'No watermark',
      'Maximum Scream customization',
      'Custom TTS voices',
      '500 GB DVR storage',
      'API access',
      'White-label options',
      '24/7 priority support',
    ],
    limits: {
      destinations: 10,
      localStreamHours: -1,
      cloudStreamHours: 40,
      chatScreams: 999,
      storage: 500,
    },
    stripePriceId:
      import.meta.env.VITE_STRIPE_BUSINESS_PRICE_ID ||
      'price_1U7PZuQ38lVRBBaoUb0prwoJ',
    hasWatermark: false,
  },
];'''
          text = text[:start] + catalog + text[end:]
          text = text.replace(
              "Cloud streaming is not available on the Free plan. Upgrade to Pro for 3 hours of cloud streaming.",
              "Cloud broadcasting is not available on the Free plan. Upgrade to Starter for 2 included cloud hours.",
          )
          write(path, text)

          # services/backend.ts — shared plan type
          path = 'services/backend.ts'
          text = read(path)
          text = replace_required(
              text,
              "export type PlanTier = 'free' | 'pro' | 'expert' | 'enterprise';",
              "export type PlanTier = 'free' | 'pro' | 'expert' | 'enterprise' | 'business';",
              'backend PlanTier',
          )
          write(path, text)

          # DVR quotas
          path = 'api/recordings.js'
          text = read(path)
          text = replace_required(
              text,
              "      free: 0,\n      pro: 10,\n      expert: 50,\n      enterprise: 250,",
              "      free: 1,\n      pro: 25,\n      expert: 100,\n      enterprise: 250,\n      business: 500,",
              'recording quotas primary',
          )
          text = replace_required(
              text,
              "return { free: 0, pro: 10, expert: 50, enterprise: 250 };",
              "return { free: 1, pro: 25, expert: 100, enterprise: 250, business: 500 };",
              'recording quotas fallback',
          )
          write(path, text)

          # Server cloud-hour enforcement and cost estimator range
          path = 'server/app.js'
          text = read(path)
          text = replace_required(
              text,
              "const PLAN_HOURS = {\n  free: 0,\n  pro: 3,\n  expert: 10,\n  enterprise: 50,\n};",
              "const PLAN_HOURS = {\n  free: 0,\n  pro: 2,\n  expert: 8,\n  enterprise: 20,\n  business: 40,\n};",
              'server cloud hours',
          )
          text = replace_required(text, '  maxDestinations: 5,', '  maxDestinations: 10,', 'cost max destinations')
          text = replace_required(text, '      commissionRate: 0.2,', '      commissionRate: 0.5,', 'affiliate default')
          text = replace_required(text, "        plan: makeAdmin ? 'enterprise'", "        plan: makeAdmin ? 'business'", 'admin max plan')
          write(path, text)

          # Root admins receive highest tier automatically
          path = 'server/store.js'
          text = read(path)
          if "plan: 'enterprise'" in text:
              text = text.replace("plan: 'enterprise'", "plan: 'business'")
          write(path, text)

          # Stream enforcement upgrade messaging and plan type support
          path = 'services/streamEnforcement.ts'
          text = read(path)
          old = """    const upgradePath: { [key in PlanTier]: string } = {\n      free: 'Upgrade to Pro ($19/mo) for 3 destinations and 3 cloud hours',\n      pro: 'Upgrade to Expert ($29/mo) for 5 destinations and 10 cloud hours',\n      expert: 'Upgrade to Enterprise ($59/mo) for unlimited destinations and 50 cloud hours',\n      enterprise: 'You are on the highest plan',\n    };"""
          new = """    const upgradePath: { [key in PlanTier]: string } = {\n      free: 'Upgrade to Starter ($19/mo) for 3 destinations and 2 cloud hours',\n      pro: 'Upgrade to Creator ($39/mo) for 5 destinations and 8 cloud hours',\n      expert: 'Upgrade to Pro ($79/mo) for 8 destinations and 20 cloud hours',\n      enterprise: 'Upgrade to Business ($149/mo) for 10 destinations and 40 cloud hours',\n      business: 'You are on the highest plan',\n    };"""
          text = replace_required(text, old, new, 'upgrade recommendations')
          write(path, text)

          # Stripe webhook price mapping — new prices + Business, preserve legacy IDs for grandfathered users.
          path = 'server/webhooks/stripe.js'
          text = read(path)
          marker = "  const proPriceId = String(\n    process.env.VITE_STRIPE_PRO_PRICE_ID || process.env.VITE_STRIPE_ENTERPRISE_PRICE_ID || '',\n  ).trim();"
          replacement = marker + "\n  const businessPriceId = String(process.env.VITE_STRIPE_BUSINESS_PRICE_ID || '').trim();"
          text = replace_required(text, marker, replacement, 'business price env')
          text = replace_required(
              text,
              "  if (priceId === proPriceId) return 'enterprise';",
              "  if (priceId === proPriceId) return 'enterprise';\n  if (priceId === businessPriceId) return 'business';\n\n  // Explicit live and grandfathered price IDs keep existing subscribers mapped correctly.\n  if (priceId === 'price_1U4uH8Q38lVRBBaogRLIp28w') return 'pro';\n  if (['price_1U4uH9Q38lVRBBaoUmGHtu4p', 'price_1U7PZkQ38lVRBBao8s6AHo1O'].includes(priceId)) return 'expert';\n  if (['price_1U4uH9Q38lVRBBaoARXrq46a', 'price_1U7PZpQ38lVRBBao4VjArshi'].includes(priceId)) return 'enterprise';\n  if (priceId === 'price_1U7PZuQ38lVRBBaoUb0prwoJ') return 'business';",
              'webhook explicit price mapping',
          )
          text = replace_required(
              text,
              "    [process.env.VITE_STRIPE_ENTERPRISE_PRICE_ID]: 'enterprise',",
              "    [process.env.VITE_STRIPE_ENTERPRISE_PRICE_ID]: 'enterprise',\n    [process.env.VITE_STRIPE_BUSINESS_PRICE_ID]: 'business',",
              'webhook env map business',
          )
          write(path, text)

          # Production env examples document exact new catalog IDs.
          for path in ['.env.example', '.env.production.example']:
              p = Path(path)
              if not p.exists():
                  continue
              text = p.read_text()
              additions = """\n# Profit-safe ChatScream subscription catalog (live)\nVITE_STRIPE_STARTER_PRICE_ID=price_1U4uH8Q38lVRBBaogRLIp28w\nVITE_STRIPE_CREATOR_PRICE_ID=price_1U7PZkQ38lVRBBao8s6AHo1O\nVITE_STRIPE_PRO_PRICE_ID=price_1U7PZpQ38lVRBBao4VjArshi\nVITE_STRIPE_BUSINESS_PRICE_ID=price_1U7PZuQ38lVRBBaoUb0prwoJ\n"""
              if 'price_1U7PZuQ38lVRBBaoUb0prwoJ' not in text:
                  text += additions
              p.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Targeted server tests
        run: npx vitest run server/__tests__/root-admin-access.test.ts --passWithNoTests

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- services/stripe.ts services/backend.ts api/recordings.js server/app.js server/store.js services/streamEnforcement.ts server/webhooks/stripe.js .env.example .env.production.example
          if git diff --cached --quiet; then
            echo "No pricing changes to commit"
            exit 0
          fi
          git commit -m "Align pricing, cloud limits, DVR quotas, and affiliate economics"
          git push origin HEAD:pricing/profit-safe-cloud-tiers
