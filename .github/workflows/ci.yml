name: Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and production build
        run: npm run build
      # The whole suite passes, so run it rather than naming individual
      # regressions and silently losing coverage of everything unnamed.
      - name: Unit and integration tests
        run: npx vitest run
