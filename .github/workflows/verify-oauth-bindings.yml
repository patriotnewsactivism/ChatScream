name: Verify OAuth bindings

on:
  pull_request:
    paths:
      - 'ops/control-plane/verify-request.txt'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'patriotnewsactivism'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/584450564662/locations/global/workloadIdentityPools/chatscream-github/providers/chatscream-main
          service_account: chatscream-cloud-ops@chat-scream.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: chatscream

      - name: Verify OAuth bindings without reading secret values
        run: |
          set -euo pipefail
          gcloud run services describe chatscream-backend \
            --project chatscream \
            --region us-central1 \
            --format=json > /tmp/service.json

          jq -r '
            .spec.template.spec.containers[0].env[]?
            | select(.name == "GOOGLE_CLIENT_ID" or .name == "GOOGLE_CLIENT_SECRET" or .name == "YOUTUBE_CLIENT_ID" or .name == "YOUTUBE_CLIENT_SECRET")
            | [.name, (if .valueFrom then "secretRef" else "literal" end), (.valueFrom.secretKeyRef.name // "-")]
            | @tsv
          ' /tmp/service.json

          jq -e '
            any(.spec.template.spec.containers[0].env[]?;
              .name == "GOOGLE_CLIENT_SECRET" and .valueFrom.secretKeyRef.name == "chatscream-google-client-secret")
            and
            any(.spec.template.spec.containers[0].env[]?;
              .name == "YOUTUBE_CLIENT_SECRET" and .valueFrom.secretKeyRef.name == "chatscream-youtube-client-secret")
          ' /tmp/service.json >/dev/null

          curl -fsS --max-time 30 https://api.chatscream.live/api/health >/dev/null
          echo 'OAuth secret bindings and API health verified.'
