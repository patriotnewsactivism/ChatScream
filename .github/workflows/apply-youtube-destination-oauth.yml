name: Apply YouTube Destination OAuth Hotfix

on:
  push:
    branches:
      - hotfix/youtube-destination-oauth

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/youtube-destination-oauth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wire backend destination OAuth
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'server/app.js',
              "import { ingressRouter as internalStudioIngressRouter, adminRouter as internalStudioAdminRouter } from './internalBridge/router.js';",
              "import { ingressRouter as internalStudioIngressRouter, adminRouter as internalStudioAdminRouter } from './internalBridge/router.js';\nimport destinationOAuthRouter, { handleYouTubeDestinationGoogleCallback } from './destinationOAuth/router.js';",
          )

          replace_once(
              'server/app.js',
              "app.use('/api/internal-studio/admin', rateLimiter(60), requireAuth, internalStudioAdminRouter);",
              "app.use('/api/internal-studio/admin', rateLimiter(60), requireAuth, internalStudioAdminRouter);\napp.use('/api/destination-oauth', rateLimiter(30), requireAuth, destinationOAuthRouter);\n// Destination OAuth reuses the already-authorized Google backend callback.\n// Non-destination Google states fall through to the existing account-login handler below.\napp.use('/api/auth/oauth/google/callback', handleYouTubeDestinationGoogleCallback);",
          )

          old = """export const getAuthorizationUrl = async (
  platform: OAuthPlatform,
  userId: string,
): Promise<string> => {
  const config = await getOAuthConfig(platform);
  const state = createOAuthState(platform, userId);
"""
          new = """export const getAuthorizationUrl = async (
  platform: OAuthPlatform,
  userId: string,
): Promise<string> => {
  // YouTube destinations use a server-bound OAuth state and the canonical
  // api.chatscream.live Google callback. This avoids redirect_uri mismatches
  // between chatscream.live and www.chatscream.live and keeps tokens server-side.
  if (platform === 'youtube') {
    const authHeader = getAuthorizationHeader();
    if (!authHeader) throw new Error('You must be signed in to connect YouTube.');
    const response = await fetch(buildApiUrl('/api/destination-oauth/youtube/start'), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: authHeader,
      },
      credentials: 'include',
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || !payload?.authUrl) {
      throw new Error(payload?.message || 'Failed to start YouTube authorization.');
    }
    return String(payload.authUrl);
  }

  const config = await getOAuthConfig(platform);
  const state = createOAuthState(platform, userId);
"""
          replace_once('services/oauthService.ts', old, new)

          replace_once(
              'pages/OAuthCallback.tsx',
              """  const isDestinationOAuthCallback = useMemo(
    () =>
      Boolean(searchParams.get('code') || searchParams.get('state') || searchParams.get('error')),
    [searchParams],
  );""",
              """  const isDestinationOAuthCallback = useMemo(
    () =>
      Boolean(
        searchParams.get('destination') ||
          searchParams.get('code') ||
          searchParams.get('state') ||
          searchParams.get('error'),
      ),
    [searchParams],
  );""",
          )

          anchor = """        setStatus('loading');
        setMessage(`Connecting ${platformLabel}...`);

        const result = await handleOAuthCallback(searchParams);"""
          replacement = """        setStatus('loading');
        setMessage(`Connecting ${platformLabel}...`);

        // The backend destination flow has already exchanged and stored the
        // provider token before redirecting here. Do not exchange the code a
        // second time; simply notify Studio and refresh the profile.
        if (searchParams.get('destination') === '1' && searchParams.get('connected') === '1') {
          try {
            await refreshProfile();
          } catch (err) {
            console.warn('Failed to refresh profile after destination OAuth:', err);
          }
          setStatus('success');
          setMessage(`Connected ${platformLabel}. You can close this window.`);
          try {
            if (window.opener && window.opener !== window) {
              window.opener.postMessage(
                { type: 'oauth:connected', platform: platformLabel },
                window.location.origin,
              );
              scheduleExit(() => window.close());
            } else {
              scheduleExit(() => navigate('/studio'));
            }
          } catch {
            scheduleExit(() => navigate('/studio'));
          }
          return;
        }

        const result = await handleOAuthCallback(searchParams);"""
          replace_once('pages/OAuthCallback.tsx', anchor, replacement)

          test = Path('server/__tests__/youtube-destination-oauth.test.ts')
          test.write_text("""import fs from 'node:fs';
import path from 'node:path';
import { describe, expect, it } from 'vitest';

const root = process.cwd();
const read = (file: string) => fs.readFileSync(path.join(root, file), 'utf8');

describe('YouTube destination OAuth regression', () => {
  it('starts YouTube destination OAuth on the backend canonical callback', () => {
    const router = read('server/destinationOAuth/router.js');
    expect(router).toContain("'https://api.chatscream.live'");
    expect(router).toContain("/api/auth/oauth/google/callback");
    expect(router).toContain("https://www.googleapis.com/auth/youtube.force-ssl");
    expect(router).toContain("setConnectedPlatform(state.uid, 'youtube'");
  });

  it('does not build the YouTube authorization URL from window.location.origin', () => {
    const oauth = read('services/oauthService.ts');
    expect(oauth).toContain("buildApiUrl('/api/destination-oauth/youtube/start')");
    expect(oauth).toContain("if (platform === 'youtube')");
  });

  it('recognizes backend-completed destination callbacks', () => {
    const callback = read('pages/OAuthCallback.tsx');
    expect(callback).toContain("searchParams.get('destination')");
    expect(callback).toContain("searchParams.get('connected') === '1'");
  });
});
""")

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          if 'YouTube destination OAuth regression' not in ci_text:
              ci_text = ci_text.rstrip() + "\n      - name: YouTube destination OAuth regression\n        run: npx vitest run server/__tests__/youtube-destination-oauth.test.ts\n"
              ci.write_text(ci_text)
          PY

      - run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Destination OAuth regression
        run: npx vitest run server/__tests__/youtube-destination-oauth.test.ts
      - name: Existing core regressions
        run: |
          npx vitest run server/__tests__/root-admin-access.test.ts
          npx vitest run server/commercial/__tests__/commercialization.test.js
          npx vitest run server/__tests__/nextgen-studio.test.ts

      - name: Commit wired hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.js services/oauthService.ts pages/OAuthCallback.tsx server/__tests__/youtube-destination-oauth.test.ts .github/workflows/ci.yml
          git commit -m "Fix YouTube destination OAuth callback flow"
          git push origin HEAD:hotfix/youtube-destination-oauth
