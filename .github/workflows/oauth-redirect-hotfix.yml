name: Apply OAuth Redirect Hotfix

on:
  push:
    branches:
      - hotfix/google-oauth-redirect
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/google-oauth-redirect
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply canonical OAuth redirect fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'services/backend.ts',
              "import { ApiRequestError, apiRequest } from './apiClient';",
              "import { ApiRequestError, apiRequest, buildApiUrl } from './apiClient';",
          )
          replace_once(
              'services/backend.ts',
              "    window.location.assign(redirectUrl || fallbackPath);",
              "    window.location.assign(buildApiUrl(redirectUrl || fallbackPath));",
          )

          p = Path('server/app.js')
          text = p.read_text()
          anchor = "const getFrontendOAuthCallbackUrl = (req) => {\n"
          helper = """const getOAuthBackendBaseUrl = (req) => {
  const explicitlyConfigured = String(process.env.OAUTH_BACKEND_BASE_URL || '').trim();
  if (explicitlyConfigured) {
    return explicitlyConfigured.replace(/\\/+$/, '');
  }

  const base = getServerBaseUrl(req).replace(/\\/+$/, '');
  try {
    const parsed = new URL(base);
    if (parsed.hostname === 'chatscream.live' || parsed.hostname === 'www.chatscream.live') {
      parsed.hostname = 'api.chatscream.live';
      parsed.port = '';
      return parsed.origin;
    }
  } catch {
    // Fall through to the server-derived base for local/custom deployments.
  }
  return base;
};

"""
          if 'const getOAuthBackendBaseUrl = (req) =>' not in text:
              if anchor not in text:
                  raise SystemExit('OAuth backend helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          old = "  const redirectUrl = `/api/auth/oauth/${provider}${referral ? `?ref=${encodeURIComponent(referral)}` : ''}`;\n  res.json({ redirectUrl });"
          new = "  const redirectPath = `/api/auth/oauth/${provider}${referral ? `?ref=${encodeURIComponent(referral)}` : ''}`;\n  const redirectUrl = `${getOAuthBackendBaseUrl(req)}${redirectPath}`;\n  res.json({ redirectUrl });"
          if new not in text:
              if old not in text:
                  raise SystemExit('Auth start redirect anchor missing')
              text = text.replace(old, new, 1)

          text = text.replace(
              "${getServerBaseUrl(req)}/api/auth/oauth/google/callback",
              "${getOAuthBackendBaseUrl(req)}/api/auth/oauth/google/callback",
          )
          text = text.replace(
              "${getServerBaseUrl(req)}/api/auth/oauth/facebook/callback",
              "${getOAuthBackendBaseUrl(req)}/api/auth/oauth/facebook/callback",
          )
          p.write_text(text)

          test = Path('server/__tests__/oauth-redirect-regression.test.ts')
          test.write_text("""import fs from 'node:fs';
import path from 'node:path';
import { describe, expect, it } from 'vitest';

const root = process.cwd();
const read = (file: string) => fs.readFileSync(path.join(root, file), 'utf8');

describe('OAuth redirect regression', () => {
  it('resolves provider login redirects against the API base', () => {
    const backend = read('services/backend.ts');
    expect(backend).toContain("import { ApiRequestError, apiRequest, buildApiUrl } from './apiClient';");
    expect(backend).toContain('window.location.assign(buildApiUrl(redirectUrl || fallbackPath));');
  });

  it('canonicalizes ChatScream OAuth callbacks to api.chatscream.live', () => {
    const server = read('server/app.js');
    expect(server).toContain("parsed.hostname = 'api.chatscream.live';");
    expect(server).toContain('`${getOAuthBackendBaseUrl(req)}/api/auth/oauth/google/callback`');
    expect(server).toContain('`${getOAuthBackendBaseUrl(req)}/api/auth/oauth/facebook/callback`');
    expect(server).toContain('const redirectUrl = `${getOAuthBackendBaseUrl(req)}${redirectPath}`;');
  });
});
""")

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          step = "      - name: OAuth redirect regression\n        run: npx vitest run server/__tests__/oauth-redirect-regression.test.ts\n"
          if 'OAuth redirect regression' not in ci_text:
              ci.write_text(ci_text.rstrip() + '\n' + step)
          PY

      - run: npm ci

      - name: Typecheck and production build
        run: npm run build

      - name: OAuth redirect regression
        run: npx vitest run server/__tests__/oauth-redirect-regression.test.ts

      - name: Existing core regressions
        run: |
          npx vitest run server/__tests__/root-admin-access.test.ts
          npx vitest run server/commercial/__tests__/commercialization.test.js
          npx vitest run server/commercial/__tests__/nextgen-studio.test.js

      - name: Commit hotfix source
        run: |
          if git diff --quiet; then
            echo "Hotfix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend.ts server/app.js server/__tests__/oauth-redirect-regression.test.ts .github/workflows/ci.yml
          git commit -m "Fix canonical OAuth redirect URI handling"
          git push origin HEAD:hotfix/google-oauth-redirect