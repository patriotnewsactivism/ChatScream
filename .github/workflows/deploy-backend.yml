name: Deploy backend to Cloud Run

# Manual phone-friendly deploy. Google authentication is keyless: GitHub exchanges
# its short-lived OIDC token for the limited chatscream-cloud-ops service account.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to ship main to production'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: chatscream
  SERVICE: chatscream-backend
  REGION: us-central1
  REPO: chatscream
  WIF_PROVIDER: projects/584450564662/locations/global/workloadIdentityPools/chatscream-github/providers/chatscream-main
  OPS_SERVICE_ACCOUNT: chatscream-cloud-ops@chat-scream.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Type 'deploy' in the confirmation box to run this workflow."
          exit 1

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with short-lived OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OPS_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify production Artifact Registry exists
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "${REPO}" \
            --location "${REGION}" --project "${PROJECT_ID}" >/dev/null

      - name: Resolve image reference
        id: image
        run: echo "ref=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build backend image
        run: docker build --target backend -t "${{ steps.image.outputs.ref }}" .

      - name: Push backend image
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deploy revision
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${{ steps.image.outputs.ref }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet

      - name: Verify production health and OAuth callback
        env:
          API_BASE: https://api.chatscream.live
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "${API_BASE}/api/health" >/dev/null
          curl -fsS --max-time 30 "${API_BASE}/api/ready" >/dev/null
          state=$(node -e "process.stdout.write(encodeURIComponent(Buffer.from(JSON.stringify({platform:'youtube',userId:'ci',timestamp:Date.now(),nonce:'ci-check',returnOrigin:'https://www.chatscream.live'})).toString('base64')))")
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 30 \
            "${API_BASE}/api/auth/oauth/google/callback?code=ci-probe&state=${state}")
          case "$location" in
            *"/oauth/callback"*"flow=destination"*)
              echo "Backend health, readiness, and YouTube destination callback verified." ;;
            *)
              echo "::error::Expected YouTube callback redirect to Studio; got: ${location}"
              exit 1 ;;
          esac
