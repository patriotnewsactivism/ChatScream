name: Deploy backend to Cloud Run

# Manual only — this never fires on a push. Open the Actions tab, pick this
# workflow, and press "Run workflow". That button works from the GitHub mobile
# site, which is the point: the API host is Cloud Run and there is otherwise no
# way to ship a backend change without a terminal.
#
# The production service is wired in as defaults below. The only thing that
# must be configured once is the GCP_SA_KEY secret.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to ship main to production'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write

env:
  # Repository variables override these, so a future project or region change
  # needs no edit to this file.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'chatscream' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'chatscream-backend' }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}
  REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'chatscream' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Type 'deploy' in the confirmation box to run this workflow."
          exit 1

      - name: Check credentials are configured
        # Passed through env, never interpolated into the script: the key is
        # multi-line JSON and would break the shell if inlined.
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::Repository secret GCP_SA_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Secrets. It needs Cloud Run Admin, Artifact Registry Writer, and Service Account User on project ${PROJECT_ID}."
            exit 1
          fi
          echo "Deploying ${SERVICE} to ${REGION} in project ${PROJECT_ID}."

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe "${REPO}" \
                --location "${REGION}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repository ${REPO}."
            gcloud artifacts repositories create "${REPO}" \
              --repository-format=docker \
              --location "${REGION}" \
              --project "${PROJECT_ID}" \
              --description "ChatScream backend images" \
              --quiet
          fi

      - name: Resolve image reference
        id: image
        run: echo "ref=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # DEPLOY.md specifies the Dockerfile's `backend` target: Node + FFmpeg,
      # no frontend bundle (Vercel serves that).
      - name: Build backend image
        run: docker build --target backend -t "${{ steps.image.outputs.ref }}" .

      - name: Push backend image
        run: docker push "${{ steps.image.outputs.ref }}"

      - name: Deploy revision
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${{ steps.image.outputs.ref }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --quiet

      # Fail loudly if the new revision did not actually change the OAuth
      # behaviour this deploy exists to ship. Probes the public hostname, so it
      # also catches the domain mapping pointing at a different service.
      - name: Verify OAuth callback lands on the callback page
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://api.chatscream.live' }}
        run: |
          state=$(node -e "process.stdout.write(encodeURIComponent(Buffer.from(JSON.stringify({platform:'youtube',userId:'ci',timestamp:Date.now(),nonce:'ci-check',returnOrigin:'https://www.chatscream.live'})).toString('base64')))")
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 30 \
            "${API_BASE}/api/auth/oauth/google/callback?code=ci-probe&state=${state}")
          echo "Redirect: ${location}"
          case "$location" in
            *"/oauth/callback"*"flow=destination"*)
              echo "YouTube destination callback routes to Studio." ;;
            *)
              echo "::error::Expected a redirect to /oauth/callback with flow=destination, got: ${location}"
              exit 1 ;;
          esac
