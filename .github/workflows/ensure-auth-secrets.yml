name: Ensure Auth Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ensure-auth-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TARGET_PROJECT: chatscream
  SERVICE: chatscream-backend
  REGION: us-central1
  WIF_PROVIDER: projects/584450564662/locations/global/workloadIdentityPools/chatscream-github/providers/chatscream-main
  OPS_SERVICE_ACCOUNT: chatscream-cloud-ops@chat-scream.iam.gserviceaccount.com

jobs:
  ensure-auth-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.OPS_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.TARGET_PROJECT }}

      - name: Store auth secrets in Secret Manager and bind Cloud Run
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_JSON="$(gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json)"
          RUNTIME_SA="$(jq -r '.spec.template.spec.serviceAccountName // empty' <<<"$SERVICE_JSON")"
          if [ -z "$RUNTIME_SA" ]; then
            PROJECT_NUMBER="$(gcloud projects describe "$TARGET_PROJECT" --format='value(projectNumber)')"
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi

          ensure_secret() {
            local env_name="$1" secret_name="$2"
            local current_type current_literal current_ref
            current_type="$(jq -r --arg n "$env_name" '[.spec.template.spec.containers[0].env[]? | select(.name==$n)][0] | if .valueFrom then "secretRef" elif has("value") then "literal" else "missing" end' <<<"$SERVICE_JSON")"
            current_ref="$(jq -r --arg n "$env_name" '[.spec.template.spec.containers[0].env[]? | select(.name==$n)][0].valueFrom.secretKeyRef.name // ""' <<<"$SERVICE_JSON")"

            if [ "$current_type" = "secretRef" ] && [ -n "$current_ref" ]; then
              gcloud secrets add-iam-policy-binding "$current_ref" --project "$TARGET_PROJECT" --member="serviceAccount:${RUNTIME_SA}" --role=roles/secretmanager.secretAccessor --quiet >/dev/null
              printf '%s=%s:latest\n' "$env_name" "$current_ref" >> /tmp/secret-bindings.txt
              return
            fi

            if ! gcloud secrets describe "$secret_name" --project "$TARGET_PROJECT" >/dev/null 2>&1; then
              gcloud secrets create "$secret_name" --project "$TARGET_PROJECT" --replication-policy=automatic --quiet >/dev/null
            fi

            if [ "$current_type" = "literal" ]; then
              current_literal="$(jq -r --arg n "$env_name" '[.spec.template.spec.containers[0].env[]? | select(.name==$n)][0].value // ""' <<<"$SERVICE_JSON")"
              if [ -n "$current_literal" ]; then
                printf '%s' "$current_literal" | gcloud secrets versions add "$secret_name" --project "$TARGET_PROJECT" --data-file=- --quiet >/dev/null
              fi
              unset current_literal
            fi

            if ! gcloud secrets versions list "$secret_name" --project "$TARGET_PROJECT" --filter='state=ENABLED' --format='value(name)' | grep -q .; then
              openssl rand -base64 64 | tr -d '\n' | gcloud secrets versions add "$secret_name" --project "$TARGET_PROJECT" --data-file=- --quiet >/dev/null
            fi

            gcloud secrets add-iam-policy-binding "$secret_name" --project "$TARGET_PROJECT" --member="serviceAccount:${RUNTIME_SA}" --role=roles/secretmanager.secretAccessor --quiet >/dev/null
            printf '%s=%s:latest\n' "$env_name" "$secret_name" >> /tmp/secret-bindings.txt
          }

          : > /tmp/secret-bindings.txt
          ensure_secret SESSION_SECRET chatscream-session-secret
          ensure_secret AUTH_STATE_SECRET chatscream-auth-state-secret

          # Remove any literal forms first because Cloud Run cannot change a variable's
          # type from literal to secretRef in the same update.
          CURRENT_JSON="$(gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json)"
          REMOVE=()
          for name in SESSION_SECRET AUTH_STATE_SECRET; do
            type="$(jq -r --arg n "$name" '[.spec.template.spec.containers[0].env[]? | select(.name==$n)][0] | if .valueFrom then "secretRef" elif has("value") then "literal" else "missing" end' <<<"$CURRENT_JSON")"
            [ "$type" = literal ] && REMOVE+=("$name")
          done
          if [ ${#REMOVE[@]} -gt 0 ]; then
            gcloud run services update "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --remove-env-vars "$(IFS=,; echo "${REMOVE[*]}")" --quiet >/dev/null
          fi

          BINDINGS="$(paste -sd, /tmp/secret-bindings.txt)"
          gcloud run services update "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --update-secrets "$BINDINGS" --quiet >/dev/null

          FINAL_JSON="$(gcloud run services describe "$SERVICE" --project "$TARGET_PROJECT" --region "$REGION" --format=json)"
          SESSION_REF="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="SESSION_SECRET")][0].valueFrom.secretKeyRef.name // ""' <<<"$FINAL_JSON")"
          AUTH_REF="$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="AUTH_STATE_SECRET")][0].valueFrom.secretKeyRef.name // ""' <<<"$FINAL_JSON")"
          test -n "$SESSION_REF"
          test -n "$AUTH_REF"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://api.chatscream.live/api/health)" = 200
          echo 'Auth secrets are Secret Manager-backed and production is healthy.'
