name: Cloud Ops Controller

on:
  push:
    paths:
      - '.github/workflows/cloud-ops-controller.yml'
      - 'ops/control-plane/request.json'
      - 'ops/control-plane/bootstrap-gcp-wif.sh'
  pull_request:
    paths:
      - '.github/workflows/cloud-ops-controller.yml'
      - 'ops/control-plane/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: chatscream-backend
  REGION: us-central1
  CONTROL_PROJECT: chat-scream

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with short-lived OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/584450564662/locations/global/workloadIdentityPools/chatscream-github/providers/chatscream-main
          service_account: chatscream-cloud-ops@chat-scream.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Discover the live ChatScream Cloud Run project
        run: |
          set -euo pipefail
          TARGET_PROJECT=""
          for candidate in "${GCP_PROJECT_ID:-}" chatscream chat-scream; do
            [ -n "$candidate" ] || continue
            if gcloud run services describe "$SERVICE" --region "$REGION" --project "$candidate" >/dev/null 2>&1; then
              TARGET_PROJECT="$candidate"
              break
            fi
          done
          if [ -z "$TARGET_PROJECT" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if gcloud run services describe "$SERVICE" --region "$REGION" --project "$candidate" >/dev/null 2>&1; then
                TARGET_PROJECT="$candidate"
                break
              fi
            done < <(gcloud projects list --format='value(projectId)')
          fi
          if [ -z "$TARGET_PROJECT" ]; then
            echo "::error::Could not find chatscream-backend. Run ops/control-plane/bootstrap-gcp-wif.sh once from Google Cloud Shell."
            exit 1
          fi
          echo "TARGET_PROJECT=$TARGET_PROJECT" >> "$GITHUB_ENV"
          echo "Cloud Run target: $TARGET_PROJECT/$REGION/$SERVICE"

      - name: Verify keyless access and OAuth configuration
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$TARGET_PROJECT" \
            --format='table(metadata.name,status.url,status.latestReadyRevisionName)'

          GOOGLE_ID="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$TARGET_PROJECT" --format='value(spec.template.spec.containers[0].env[?name=GOOGLE_CLIENT_ID].value)' || true)"
          YOUTUBE_ID="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$TARGET_PROJECT" --format='value(spec.template.spec.containers[0].env[?name=YOUTUBE_CLIENT_ID].value)' || true)"

          test "$GOOGLE_ID" = '584450564662-vvlnooo2oe25ltstet0mkqajm4ta80d8.apps.googleusercontent.com' || {
            echo "::error::GOOGLE_CLIENT_ID is not the expected dedicated Google sign-in client."
            exit 1
          }
          test "$YOUTUBE_ID" = '584450564662-ek0a4ibt01t9ho6guc7sfqp59dq0vrs5.apps.googleusercontent.com' || {
            echo "::error::YOUTUBE_CLIENT_ID is not the expected dedicated YouTube client."
            exit 1
          }

          response="$(curl -fsS --max-time 30 https://api.chatscream.live/api/public/oauth-debug || true)"
          printf '%s\n' "$response" | jq . || true

      - name: Show controller request
        run: |
          if [ -f ops/control-plane/request.json ]; then
            jq . ops/control-plane/request.json
          else
            echo '{"action":"verify"}'
          fi
